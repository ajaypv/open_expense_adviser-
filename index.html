<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The main text font starts downloading with the page, so figures do not appear in a fallback font first. -->
    <link rel="preload" href="/src/assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f1ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Expenses" />
    <title>Expense Tracker</title>
    <script>
      // Apply a saved theme and colours before first paint to avoid a flash of the wrong ones.
      try {
        var t = localStorage.getItem('theme')
        // Light unless a choice was made; 'system' is a choice, and leaves the phone to decide.
        if (t !== 'system') {
          var dark = t === 'dark'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          // The browser's bars match the page, whatever the phone is set to.
          var bars = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < bars.length; i++) bars[i].setAttribute('content', dark ? '#121314' : '#f2f1ed')
        }
        var p = localStorage.getItem('palette')
        if (/^(ocean|forest|sunset|lavender|rose|liquid|pearl|aurora|neon|obsidian)$/.test(p)) document.documentElement.dataset.palette = p
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
